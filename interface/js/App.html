        const ROLE_LABELS = {
            superAdmin: 'Administrador General',
            adminPQR: 'Admin PQR',
            adminRenovations: 'Admin Renovaciones',
            adminVidaDesempleo: 'Admin Vida y Desempleo',
            Coordinadora: 'Coordinadora',
            pqr: 'Gestor PQR',
            Renovations: 'Renovaciones',
            'Seguro de Vida': 'Seguro de Vida',
            'Seguro de Desempleo': 'Seguro de Desempleo'
        };

        function getDashboardSettings() {
            try {
                var s = localStorage.getItem('dashboardSettings');
                return s ? JSON.parse(s) : { chartType: 'doughnut', density: 'normal', visibleSections: {} };
            } catch (e) { return { chartType: 'doughnut', density: 'normal', visibleSections: {} }; }
        }
        function setDashboardSettings(settings) {
            localStorage.setItem('dashboardSettings', JSON.stringify(settings));
        }

        const mockData = [
            {
                rowNumber: 2, id: 'PQR-2026-001', tipo: 'QUEJA', fechaCreacion: '2026-02-17T10:08:27',
                estado: 'Pendiente', prioridad: 'Alta', asesor: 'Sin Asignar', fechaAsignacion: '', fechaCierre: '',
                informacion: {
                    solicitante: { nombreCompleto: "María González López", tipoDocumento: "CC", numeroDocumento: "9876543210", email: "maria.gonzalez@example.com", telefono: "3109876543" },
                    tramite: { tipoSolicitud: "QUEJA", productoRelacionado: "Póliza Vida", asunto: "Cobro indebido", descripcionDetallada: "Me han cobrado dos veces la cuota de este mes en mi tarjeta." }
                },
                historial: []
            },
            {
                rowNumber: 3, id: 'PQR-2026-002', tipo: 'PETICION', fechaCreacion: '2026-02-16T14:30:00',
                estado: 'En Proceso', prioridad: 'Media', asesor: 'maria.gaitan@proyectivaseguros.com', fechaAsignacion: '2026-02-16T15:00:00', fechaCierre: '',
                informacion: {
                    solicitante: { nombreCompleto: "Carlos Ruiz", tipoDocumento: "CE", numeroDocumento: "123456", email: "carlos.ruiz@mail.com", telefono: "3201234567" },
                    tramite: { tipoSolicitud: "PETICION", productoRelacionado: "Póliza Auto", asunto: "Certificado de cobertura", descripcionDetallada: "Solicito certificado urgente para trámite de tránsito." }
                },
                historial: [
                    { fecha: '2026-02-16T15:00:00', usuario: 'maria.gaitan@proyectivaseguros.com', accion: 'PQR asignada e iniciada validación en sistema core.', estadoAnterior: 'Pendiente', estadoNuevo: 'En Proceso' }
                ]
            }
        ];

        // --- INICIALIZACIÓN ---
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            const renoSearch = document.getElementById('reno-search');
            const renoFilter = document.getElementById('reno-filter-estado');
            if (renoSearch) renoSearch.addEventListener('input', () => { renoPage = 1; renderRenovacionesTab(); });
            if (renoFilter) renoFilter.addEventListener('change', () => { renoPage = 1; renderRenovacionesTab(); });
            const vdSearch = document.getElementById('vd-search');
            const vdFilter = document.getElementById('vd-filter-producto');
            if (vdSearch) vdSearch.addEventListener('input', () => { vdPage = 1; renderVDTab(); });
            if (vdFilter) vdFilter.addEventListener('change', () => { vdPage = 1; renderVDTab(); });
            document.querySelectorAll('input[name="vd-producto-gestion"]').forEach(r => r.addEventListener('change', () => { vdUpdateProductLabels(); vdValidarEdad(); vdShowStep(vdCurrentStep); }));
            document.querySelectorAll('input[name="vd-tipo-vinculacion"]').forEach(r => r.addEventListener('change', function() {
                const c = document.getElementById('vd-tipo-contrato-container');
                if (c) c.classList.toggle('hidden', this.value !== 'Empleado');
                vdValidarTipoVinculacion();
                if (vdCurrentStep === 4 && vdGetProducto() === 'desempleo') vdRenderCoberturas();
            }));
            const canalDesc = document.getElementById('vd-canal-descuento');
            if (canalDesc) canalDesc.addEventListener('change', function() {
                const tc = document.getElementById('vd-tc-fields');
                const franq = document.getElementById('vd-franquicia-descuento');
                if (tc) tc.classList.toggle('hidden', this.value !== 'Tarjeta Credito');
                if (franq) { franq.required = this.value === 'Tarjeta Credito'; franq.value = ''; }
                vdValidateAccountNumber();
                vdValidarDescuento();
            });
            // IMC se calcula vía onchange/oninput en vdCalcularIMC()
            ['vd-numero-cuenta','vd-entidad-bancaria','vd-valor-prima'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', function() {
                    const g = { 'vd-numero-cuenta': 'vd-guion-num-cuenta', 'vd-entidad-bancaria': 'vd-guion-entidad', 'vd-valor-prima': 'vd-guion-prima' };
                    const t = document.getElementById(g[id]);
                    if (t) t.textContent = this.value || '____';
                });
            });
            ['vd-canon','vd-administracion','vd-costo-proteccion'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.addEventListener('input', vdActualizarGuionCotizador);
                if (el) el.addEventListener('change', vdActualizarGuionCotizador);
            });
            document.querySelectorAll('#modalLead-vd .vd-step').forEach((el, i) => {
                el.addEventListener('click', () => {
                    const step = i + 1;
                    if (step <= vdCurrentStep) vdShowStep(step);
                });
            });
        });

        function toggleSidebar() {
            sidebarCollapsed = !sidebarCollapsed;
            const sidebar = document.getElementById('sidebar');
            const main = document.getElementById('main-content');
            if (sidebar) sidebar.classList.toggle('sidebar-collapsed', sidebarCollapsed);
            if (main) main.style.marginLeft = sidebarCollapsed ? '0' : '16rem';
        }

        function getFilteredData() {
            let data = appData;
            if (filterKPI === 'proceso') data = data.filter(p => p.estado === 'En Proceso');
            else if (filterKPI === 'resueltas') data = data.filter(p => p.estado === 'Resuelto' || p.estado === 'Cerrado');
            else if (filterKPI === 'vencidas') data = data.filter(p => p.estado !== 'Resuelto' && p.estado !== 'Cerrado' && (new Date() - new Date(p.fechaCreacion)) > (3 * 24 * 60 * 60 * 1000));
            const term = (document.getElementById('searchInput')?.value || '').toLowerCase();
            const estado = document.getElementById('filterEstado')?.value || '';
            return data.filter(pqr => {
                const matchTerm = !term || pqr.id.toLowerCase().includes(term) || (pqr.informacion?.solicitante?.nombreCompleto || '').toLowerCase().includes(term) || (pqr.informacion?.solicitante?.numeroDocumento || '').includes(term);
                const matchEstado = !estado || pqr.estado === estado;
                return matchTerm && matchEstado;
            });
        }

        function setKpiFilter(k) {
            if (k && k.startsWith('section-')) {
                selectedOperation = k.replace('section-', '');
                filterKPI = (selectedOperation === 'pqr') ? null : null;
            } else if (k === null || k === undefined || k === '') {
                selectedOperation = null;
                filterKPI = null;
            } else {
                selectedOperation = 'pqr';
                filterKPI = k;
            }
            pqrPage = 1;
            recentPage = 1;
            var onDashboard = document.getElementById('view-dashboard') && !document.getElementById('view-dashboard').classList.contains('hidden');
            if (onDashboard) {
                renderDashboard();
            } else {
                var filtered = getFilteredData();
                renderTable(filtered);
                renderRecentTable(filtered);
                drawChart(filtered);
            }
        }

        // --- NAVEGACIÓN ---
        function switchTab(tabId) {
            if (tabId === 'admin' && !userIsAdmin) {
                switchTab('dashboard');
                return;
            }
            document.querySelectorAll('aside nav a').forEach(a => {
                a.classList.remove('bg-blue-800', 'text-white');
                a.classList.add('text-blue-200');
            });
            const navEl = document.getElementById(`nav-${tabId}`);
            if (navEl) {
                navEl.classList.add('bg-blue-800', 'text-white');
                navEl.classList.remove('text-blue-200');
            }

            document.getElementById('view-dashboard').classList.add('hidden');
            document.getElementById('view-pqrs').classList.add('hidden');
            const viewAdmin = document.getElementById('view-admin');
            if (viewAdmin) viewAdmin.classList.add('hidden');
            const viewReno = document.getElementById('view-renovaciones');
            const viewVD = document.getElementById('view-vd');
            if (viewReno) viewReno.classList.add('hidden');
            if (viewVD) viewVD.classList.add('hidden');
            const viewEl = document.getElementById(`view-${tabId}`);
            if (viewEl) viewEl.classList.remove('hidden');

            if (tabId === 'dashboard') renderDashboard();
            if (tabId === 'admin') renderAdminTab();
            if (tabId === 'renovaciones') renderRenovacionesTab();
            if (tabId === 'vd') renderVDTab();

            const titles = { dashboard: 'Dashboard Ejecutivo', pqrs: 'Gestión General de Leads — PQR', admin: 'Panel de Administración', renovaciones: 'Gestión de Renovaciones', vd: 'Vida y Desempleo' };
            document.getElementById('header-title').innerText = titles[tabId] || 'Proyectiva';
        }

        // --- ADMIN: Renderizar y acciones ---
        function renderAdminTab() {
            const sinAsignar = appData.filter(p => !p.asesor || p.asesor === 'Sin Asignar' || p.asesor === '');
            const asignadas = appData.filter(p => p.asesor && p.asesor !== 'Sin Asignar');
            const enProceso = appData.filter(p => p.estado === 'En Proceso');

            document.getElementById('admin-kpi-sinasignar').innerText = sinAsignar.length;
            document.getElementById('admin-kpi-asignadas').innerText = asignadas.length;
            document.getElementById('admin-kpi-usuarios').innerText = listUsuarios.length;
            document.getElementById('admin-kpi-proceso').innerText = enProceso.length;

            const tbody1 = document.getElementById('admin-sinasignar-body');
            const empty1 = document.getElementById('admin-sinasignar-empty');
            const tbody2 = document.getElementById('admin-asignadas-body');
            const empty2 = document.getElementById('admin-asignadas-empty');
            const tbody3 = document.getElementById('admin-novedades-body');
            const empty3 = document.getElementById('admin-novedades-empty');

            if (tbody1) {
                tbody1.innerHTML = '';
                if (empty1) empty1.classList.toggle('hidden', sinAsignar.length > 0);
                const total1 = sinAsignar.length;
                const pag1 = sinAsignar.slice((adminSinAsignarPage - 1) * PAGE_SIZE, adminSinAsignarPage * PAGE_SIZE);
                renderPagination('admin-sinasignar-pagination', adminSinAsignarPage, total1, 'setAdminSinAsignarPage');
                pag1.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-semibold text-proyectiva-blue">${p.id}</td>
                        <td class="px-6 py-4 text-gray-800">${p.informacion?.solicitante?.nombreCompleto || 'N/A'}</td>
                        <td class="px-6 py-4">${getStatusBadge(p.estado)}</td>
                        <td class="px-6 py-4"><select class="admin-asignar-select border border-gray-300 rounded-lg px-3 py-2 text-sm w-full max-w-[220px] focus:ring-2 focus:ring-proyectiva-orange" data-row="${p.rowNumber}"><option value="">Seleccionar asesor...</option>${(listUsuarios || []).map(u => `<option value="${u.correo}">${u.nombre}</option>`).join('')}</select></td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="openModalByRow(${p.rowNumber})" class="text-proyectiva-blue hover:text-proyectiva-orange font-medium text-sm mr-2" title="Gestionar">Gestionar</button>
                            <button onclick="asignarPQRAdmin(${p.rowNumber}, this)" class="bg-proyectiva-blue hover:bg-blue-900 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-colors">Asignar</button>
                        </td>
                    `;
                    tbody1.appendChild(tr);
                });
            }

            if (tbody2) {
                tbody2.innerHTML = '';
                if (empty2) empty2.classList.toggle('hidden', asignadas.length > 0);
                const total2 = asignadas.length;
                const pag2 = asignadas.slice((adminAsignadasPage - 1) * PAGE_SIZE, adminAsignadasPage * PAGE_SIZE);
                renderPagination('admin-asignadas-pagination', adminAsignadasPage, total2, 'setAdminAsignadasPage');
                pag2.forEach(p => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-semibold text-proyectiva-blue">${p.id}</td>
                        <td class="px-6 py-4 text-gray-800">${p.informacion?.solicitante?.nombreCompleto || 'N/A'}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${p.asesor}</td>
                        <td class="px-6 py-4"><select class="admin-reasignar-select border border-gray-300 rounded-lg px-3 py-2 text-sm w-full max-w-[220px] focus:ring-2 focus:ring-proyectiva-orange" data-row="${p.rowNumber}">${(listUsuarios || []).map(u => `<option value="${u.correo}" ${u.correo === p.asesor ? 'selected' : ''}>${u.nombre}</option>`).join('')}</select></td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="openModalByRow(${p.rowNumber})" class="text-proyectiva-blue hover:text-proyectiva-orange font-medium text-sm mr-2" title="Gestionar">Gestionar</button>
                            <button onclick="reasignarPQRAdmin(${p.rowNumber}, this)" class="bg-proyectiva-orange hover:bg-orange-600 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-colors">Reasignar</button>
                        </td>
                    `;
                    tbody2.appendChild(tr);
                });
            }

            if (tbody3) {
                tbody3.innerHTML = '';
                if (empty3) empty3.classList.toggle('hidden', listUsuarios.length > 0);
                const total3 = listUsuarios.length;
                const pag3 = listUsuarios.slice((adminNovedadesPage - 1) * PAGE_SIZE, adminNovedadesPage * PAGE_SIZE);
                renderPagination('admin-novedades-pagination', adminNovedadesPage, total3, 'setAdminNovedadesPage');
                pag3.forEach(u => {
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-gray-50 transition-colors';
                    tr.innerHTML = `
                        <td class="px-6 py-4 font-medium text-gray-800">${u.nombre}</td>
                        <td class="px-6 py-4 text-sm text-gray-600">${u.correo}</td>
                        <td class="px-6 py-4"><span class="px-2 py-1 text-xs font-medium rounded ${u.seguro === 'admin' ? 'bg-proyectiva-light text-proyectiva-blue' : 'bg-gray-100 text-gray-700'}">${u.seguro || 'pqr'}</span></td>
                        <td class="px-6 py-4 text-sm text-gray-600 max-w-[200px] truncate">${u.novedad || '-'}</td>
                        <td class="px-6 py-4"><input type="text" class="admin-novedad-input border border-gray-300 rounded-lg px-3 py-2 text-sm w-full focus:ring-2 focus:ring-proyectiva-orange" placeholder="Escriba la novedad..." data-correo="${u.correo}" value="${u.novedad || ''}"></td>
                        <td class="px-6 py-4 text-center"><button onclick="guardarNovedadAdmin(this)" data-correo="${(u.correo || '').replace(/"/g, '&quot;')}" class="bg-proyectiva-blue hover:bg-blue-900 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-colors">Guardar</button></td>
                    `;
                    tbody3.appendChild(tr);
                });
            }
        }

        function setAdminSinAsignarPage(p) {
            const sinAsignar = appData.filter(x => !x.asesor || x.asesor === 'Sin Asignar' || x.asesor === '');
            const maxP = Math.max(1, Math.ceil(sinAsignar.length / PAGE_SIZE));
            if (p >= 1 && p <= maxP) { adminSinAsignarPage = p; renderAdminTab(); }
        }
        function setAdminAsignadasPage(p) {
            const asignadas = appData.filter(x => x.asesor && x.asesor !== 'Sin Asignar');
            const maxP = Math.max(1, Math.ceil(asignadas.length / PAGE_SIZE));
            if (p >= 1 && p <= maxP) { adminAsignadasPage = p; renderAdminTab(); }
        }
        function setAdminNovedadesPage(p) {
            const maxP = Math.max(1, Math.ceil((listUsuarios || []).length / PAGE_SIZE));
            if (p >= 1 && p <= maxP) { adminNovedadesPage = p; renderAdminTab(); }
        }
        function asignarPQRAdmin(rowNumber, btn) {
            const row = btn.closest('tr');
            const select = row?.querySelector('.admin-asignar-select');
            const asesor = select?.value?.trim();
            if (!asesor) { Swal.fire('Aviso', 'Seleccione un usuario.', 'warning'); return; }
            const pqr = appData.find(p => p.rowNumber === rowNumber);
            if (!pqr) return;
            const payload = { ...pqr, estadoAnterior: pqr.estado, estado: pqr.estado, asesor, nuevaAccionTexto: 'Asignación desde panel admin' };
            if (isAppsScript) {
                btn.disabled = true;
                google.script.run.withSuccessHandler(r => { const res = JSON.parse(r); if (res.status === 'success') { Swal.fire('Éxito', res.message, 'success'); loadData(); } else showError('Error', res.message); btn.disabled = false; }).withFailureHandler(e => { showError('Error', e); btn.disabled = false; }).updatePQR(JSON.stringify(payload));
            }
        }

        function reasignarPQRAdmin(rowNumber, btn) {
            const row = btn.closest('tr');
            const select = row.querySelector('.admin-reasignar-select');
            const asesor = select?.value;
            if (!asesor) return;
            const pqr = appData.find(p => p.rowNumber === rowNumber);
            if (!pqr) return;
            const payload = { ...pqr, estadoAnterior: pqr.estado, estado: pqr.estado, asesor, nuevaAccionTexto: 'Reasignación desde panel admin' };
            if (isAppsScript) {
                btn.disabled = true;
                google.script.run.withSuccessHandler(r => { const res = JSON.parse(r); if (res.status === 'success') { Swal.fire('Éxito', res.message, 'success'); loadData(); } else showError('Error', res.message); btn.disabled = false; }).withFailureHandler(e => { showError('Error', e); btn.disabled = false; }).updatePQR(JSON.stringify(payload));
            }
        }

        function guardarNovedadAdmin(btn) {
            const correo = btn.getAttribute('data-correo') || '';
            const row = btn.closest('tr');
            const input = row?.querySelector('.admin-novedad-input');
            const novedad = input?.value || '';
            if (isAppsScript && correo) {
                btn.disabled = true;
                google.script.run.withSuccessHandler(r => { const res = JSON.parse(r); if (res.status === 'success') { Swal.fire('Éxito', res.message, 'success'); loadData(); } else showError('Error', res.message); btn.disabled = false; }).withFailureHandler(e => { showError('Error', e); btn.disabled = false; }).updateUsuarioNovedad(correo, novedad);
            }
        }

        function crearUsuario(e) {
            e.preventDefault();
            const payload = { nombre: document.getElementById('admin-nombre').value, correo: document.getElementById('admin-correo').value, seguro: document.getElementById('admin-seguro').value, novedad: document.getElementById('admin-novedad').value };
            if (isAppsScript) {
                const btn = e.target.querySelector('button[type="submit"]');
                btn.disabled = true;
                google.script.run.withSuccessHandler(r => { const res = JSON.parse(r); if (res.status === 'success') { Swal.fire('Éxito', res.message, 'success'); e.target.reset(); loadData(); } else showError('Error', res.message); btn.disabled = false; }).withFailureHandler(err => { showError('Error', err); btn.disabled = false; }).createUsuario(payload);
            } else {
                Swal.fire('Preview', 'En producción se crearía el usuario.', 'info');
                e.target.reset();
            }
        }

        // --- RENOVACIONES ---
        function getFilteredRenovaciones() {
            const term = (document.getElementById('reno-search')?.value || '').toLowerCase();
            const estado = document.getElementById('reno-filter-estado')?.value || '';
            return renovacionesData.filter(r => {
                const ld = r.leadData || r;
                const poliza = (ld.poliza || r.poliza || '').toString();
                const asegurado = (ld.asegurado || r.asegurado || '').toString();
                const matchTerm = !term || poliza.toLowerCase().includes(term) || asegurado.toLowerCase().includes(term);
                const est = r.estadoGestion || r.estado || '';
                const matchEstado = !estado || est === estado;
                return matchTerm && matchEstado;
            });
        }

        function renderRenovacionesTab() {
            if (!document.getElementById('reno-table-body')) return;
            const filtered = getFilteredRenovaciones();
            const total = renovacionesData.length;
            const porVencer = renovacionesData.filter(r => (r.estadoGestion || r.estado || '') === 'Pendiente Renovacion').length;
            const renovadas = renovacionesData.filter(r => (r.estadoGestion || r.estado || '') === 'Poliza Renovada').length;
            const vencidas = renovacionesData.filter(r => (r.estadoGestion || r.estado || '') === 'VENCIDO').length;

            document.getElementById('reno-kpi-total').innerText = total;
            document.getElementById('reno-kpi-vencer').innerText = porVencer;
            document.getElementById('reno-kpi-renovadas').innerText = renovadas;
            document.getElementById('reno-kpi-vencidas').innerText = vencidas;

            const tbody = document.getElementById('reno-table-body');
            const empty = document.getElementById('reno-empty');
            if (!tbody) return;
            tbody.innerHTML = '';

        /** Formato COP unificado para modal renovaciones (bug 2.5) */
        function renoFormatearMoneda(val) {
            if (val == null || val === '') return '—';
            if (typeof val === 'number' && !isNaN(val)) {
                return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(val);
            }
            const s = String(val).trim();
            const digits = s.replace(/[^\d]/g, '');
            if (!digits) return s;
            const n = parseInt(digits, 10);
            if (isNaN(n)) return s;
            return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', maximumFractionDigits: 0 }).format(n);
        }

        /** Oculta productos según rol y corrige selección si el asignado quedó oculto (bug 2.3) */
        function vdAplicarProductosPorEspecialidad() {
            var role = ((userInfo && userInfo.role) || '').toString().trim();
            var labelVida = document.getElementById('vd-label-vida');
            var labelDes = document.getElementById('vd-label-desempleo');
            var radioVida = document.querySelector('input[name="vd-producto-gestion"][value="vida"]');
            var radioDes = document.querySelector('input[name="vd-producto-gestion"][value="desempleo"]');
            if (!labelVida || !labelDes) return;
            labelVida.classList.remove('hidden');
            labelDes.classList.remove('hidden');
            if (role === 'Seguro de Vida') {
                labelDes.classList.add('hidden');
                if (radioDes && radioDes.checked && radioVida) {
                    radioVida.checked = true;
                    Swal.fire('Producto ajustado', 'El producto asignado (Desempleo) no está disponible para su rol. Se seleccionó Vida automáticamente.', 'info');
                }
            } else if (role === 'Seguro de Desempleo') {
                labelVida.classList.add('hidden');
                if (radioVida && radioVida.checked && radioDes) {
                    radioDes.checked = true;
                    Swal.fire('Producto ajustado', 'El producto asignado (Vida) no está disponible para su rol. Se seleccionó Desempleo automáticamente.', 'info');
                }
            }
        }

        function vdCalcularEdad(fechaStr) {
            if (!fechaStr) return null;
            const hoy = new Date();
            const nac = new Date(fechaStr);
            if (isNaN(nac.getTime())) return null;
            let edad = hoy.getFullYear() - nac.getFullYear();
            const m = hoy.getMonth() - nac.getMonth();
            const d = hoy.getDate() - nac.getDate();
            if (m < 0 || (m === 0 && d < 0)) edad--;
            return edad;
        }

        /** Helper: muestra feedback visual en tiempo real (borde rojo/verde + mensaje) */
        function vdMostrarFeedbackCampo(el, valido, mensaje) {
            if (vdSuppressValidation) return;
            if (!el) return;
            el.classList.remove('border-red-500', 'border-green-500');
            el.classList.add(valido ? 'border-green-500' : 'border-red-500');
            let msgEl = document.getElementById((el.id || 'vd-msg') + '-msg');
            if (!msgEl && el.id) {
                msgEl = document.createElement('p');
                msgEl.id = el.id + '-msg';
                msgEl.className = 'text-sm mt-1';
                el.parentNode.appendChild(msgEl);
            }
            if (msgEl) {
                msgEl.textContent = mensaje || '';
                msgEl.className = 'text-sm mt-1 ' + (valido ? 'text-green-600' : 'text-red-600');
                msgEl.classList.toggle('hidden', !mensaje);
            }
        }

        /** Validador EMAIL - tiempo real */
        function vdValidarEmail() {
            if (vdSuppressValidation) return true;
            const el = document.getElementById('vd-email-cliente');
            const v = (el?.value || '').trim();
            if (!v) { vdMostrarFeedbackCampo(el, false, 'El correo es requerido.'); return false; }
            const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!regex.test(v)) { vdMostrarFeedbackCampo(el, false, 'Formato de correo inválido.'); return false; }
            vdMostrarFeedbackCampo(el, true, '');
            return true;
        }

        /** Validador COTIZADOR - tiempo real */
        function vdValidarCotizador() {
            if (vdSuppressValidation) return true;
            const canonEl = document.getElementById('vd-canon');
            const costoEl = document.getElementById('vd-costo-proteccion');
            const canon = parseFloat(canonEl?.value) || 0;
            const costo = parseFloat(costoEl?.value) || 0;
            if (canon <= 0) { vdMostrarFeedbackCampo(canonEl, false, 'El canon debe ser mayor a 0.'); return false; }
            vdMostrarFeedbackCampo(canonEl, true, '');
            if (costo <= 0) { vdMostrarFeedbackCampo(costoEl, false, 'El costo de protección debe ser mayor a 0.'); return false; }
            vdMostrarFeedbackCampo(costoEl, true, '');
            return true;
        }

        /** Validador Información Médica (Vida) - condiciones que implican NO ASEGURABLE */
        function vdValidarInfoMedica() {
            const condNoAseg = [
                { name: 'vd-sida', msg: 'SIDA' },
                { name: 'vd-vih', msg: 'VIH positivo' }
            ];
            const condAdvertencia = [
                { name: 'vd-cancer', msg: 'Cáncer o tumores' },
                { name: 'vd-derrame', msg: 'Derrame o trombosis cerebral' },
                { name: 'vd-psicologicas', msg: 'Enfermedades psicológicas/psiquiátricas' }
            ];
            const cont = document.getElementById('vd-info-medica-msg');
            if (!cont) return true;
            for (const c of condNoAseg) {
                const val = document.querySelector(`input[name="${c.name}"]:checked`)?.value;
                if (val === 'si') {
                    cont.innerHTML = `<span class="text-red-600 font-semibold"><i class="fas fa-ban mr-1"></i>NO ASEGURABLE. ${c.msg}. La gestión debe suspenderse.</span>`;

            }
            for (const c of condAdvertencia) {
                const val = document.querySelector(`input[name="${c.name}"]:checked`)?.value;
                if (val === 'si') {
                    cont.innerHTML = `<span class="text-amber-700 font-medium"><i class="fas fa-exclamation-triangle mr-1"></i>Advertencia: ${c.msg}. Evalúe con el área médica antes de continuar.</span>`;
                    cont.classList.remove('hidden');
                    return true;
                }
            }
            cont.innerHTML = '';
            cont.classList.add('hidden');

        /** Auto-detecta franquicia por número y valida (medio de pago) */

            const franqEl = document.getElementById('vd-franquicia-descuento');
            if (canal === 'Tarjeta Credito' && numEl && franqEl) {
                const franq = vdDetectarFranquiciaPorNumero(numEl.value);
                if (franq && franqEl.value !== franq) {
                    franqEl.value = franq;
                    const opt = franqEl.querySelector(`option[value="${franq}"]`);

        /** Detecta franquicia por BIN (primeros dígitos de tarjeta) */
        function vdDetectarFranquiciaPorNumero(num) {
            const n = (num || '').replace(/[\s-]/g, '');
            if (n.length < 4) return '';
            const d1 = n.charAt(0);
            const d2 = n.substring(0, 2);
            const d4 = n.substring(0, 4);
            const d4n = parseInt(d4, 10);
            if (d1 === '4') return 'VISA';
            if (d2 === '34' || d2 === '37') return 'AMERICAN EXPRESS';
            if (d2 === '36' || d2 === '38') return 'DINERS CLUB';
            if (d4n >= 3000 && d4n <= 3059) return 'DINERS CLUB';
            if (d2 === '51' || d2 === '52' || d2 === '53' || d2 === '54' || d2 === '55') return 'MASTER CARD';
            if (d4n >= 2221 && d4n <= 2720) return 'MASTER CARD';
            return '';
        }

        /** Validador y gestión BENEFICIARIOS - suma 100%, bloqueo y auto % */
        function vdValidarBeneficiarios() {
            const b1 = document.getElementById('vd-ben1-designacion');
            const b2 = document.getElementById('vd-ben2-designacion');
            const b3 = document.getElementById('vd-ben3-designacion');
            const c2 = document.getElementById('vd-ben2-container');
            const c3 = document.getElementById('vd-ben3-container');
            let d1 = parseFloat(b1?.value) || 0;
            let d2 = parseFloat(b2?.value) || 0;
            let d3 = parseFloat(b3?.value) || 0;

            if (d1 >= 100) {
                if (b1) b1.value = 100;
                d1 = 100;
                if (b2) { b2.value = 0; b2.disabled = true; }
                if (b3) { b3.value = 0; b3.disabled = true; }
                if (c2) c2.classList.add('opacity-50', 'pointer-events-none');
                if (c3) c3.classList.add('opacity-50', 'pointer-events-none');
            } else {
                if (b2) b2.disabled = false;
                if (c2) c2.classList.remove('opacity-50', 'pointer-events-none');
                const restante12 = 100 - d1;
                if (d2 >= restante12) {
                    if (b2) b2.value = restante12;
                    d2 = restante12;
                    if (b3) { b3.value = 0; b3.disabled = true; }
                    if (c3) c3.classList.add('opacity-50', 'pointer-events-none');
                } else {
                    if (b3) b3.disabled = false;
                    if (c3) c3.classList.remove('opacity-50', 'pointer-events-none');
                    const auto3 = 100 - d1 - d2;
                    if (auto3 >= 0 && b3 && !b3.disabled) b3.value = Math.round(auto3);
                }
            }
            d1 = parseFloat(b1?.value) || 0;
            d2 = parseFloat(b2?.value) || 0;
            d3 = parseFloat(b3?.value) || 0;
            const sum = d1 + d2 + d3;
            const msgEl = document.getElementById('vd-ben-sum-msg');
            const restEl = document.getElementById('vd-ben-restante');
            if (restEl) { restEl.textContent = 'Restante: ' + (100 - sum) + '%'; restEl.classList.remove('hidden'); }
            if (!msgEl) return sum === 100;
            if (sum !== 100) {
                msgEl.textContent = 'La suma debe ser 100% (actual: ' + sum + '%)';
                msgEl.classList.remove('hidden');
                return false;
            }
            msgEl.textContent = '';
            msgEl.classList.add('hidden');
            return true;
        }

        /** Calcula IMC y asegurabilidad en tiempo real (base CRM) */
        function vdCalcularIMC() {
            if (vdSuppressValidation) return;
            const p = parseFloat(document.getElementById('vd-peso')?.value);
            const e = parseFloat(document.getElementById('vd-estatura')?.value) / 100;
            const imcEl = document.getElementById('vd-imc');
            const asegEl = document.getElementById('vd-asegurable');
            if (!p || !e || e <= 0) {
                if (imcEl) imcEl.value = '';
                if (asegEl) { asegEl.value = ''; asegEl.placeholder = 'Ingrese peso y estatura'; asegEl.className = 'w-full border rounded-lg px-3 py-2 font-semibold text-center'; }
                return;
            }
            const imc = p / (e * e);
            if (imcEl) imcEl.value = imc.toFixed(2);
            let status = '';
            let cls = 'w-full border rounded-lg px-3 py-2 font-semibold text-center ';
            if (imc > 15 && imc < 30) {
                status = 'ASEGURABLE';
                cls += 'bg-green-100 text-green-800 border-green-300';
            } else if (imc >= 30 && imc < 31) {
                status = 'ASEGURABLE CON CONSULTA MÉDICA';
                cls += 'bg-amber-100 text-amber-800 border-amber-300';
            } else {
                status = 'NO ASEGURABLE';
                cls += 'bg-red-100 text-red-800 border-red-300';
            }
            if (asegEl) { asegEl.value = status; asegEl.className = cls; asegEl.placeholder = ''; }
        }

        /** Validador de cuenta/tarjeta - igual que base CRM (validateAccountNumber) */
        function vdValidateAccountNumber() {
            if (vdSuppressValidation) return true;
            const canal = document.getElementById('vd-canal-descuento')?.value;
            const entidad = document.getElementById('vd-entidad-bancaria')?.value;
            const franquicia = document.getElementById('vd-franquicia-descuento')?.value;
            const numEl = document.getElementById('vd-numero-cuenta');
            const digitosEl = document.getElementById('vd-cuenta-digitos');
            const numero = (numEl?.value || '').replace(/[\s-]/g, '');
            const numeroLength = numero.length;

            numEl?.classList.remove('border-red-500', 'border-green-500');
            if (digitosEl) digitosEl.textContent = '';
            digitosEl?.classList.remove('text-red-600', 'text-green-600', 'text-gray-500');

            let expectedLengths = [];
            let feedbackMessage = '';
            let isValid = true;

            if (canal === 'Tarjeta Credito') {
                if (entidad && vdAccountLengthConfig[entidad] && vdAccountLengthConfig[entidad]['Tarjeta Credito']) {
                    expectedLengths = vdAccountLengthConfig[entidad]['Tarjeta Credito'];
                } else if (franquicia && vdAccountLengthConfig[franquicia] && vdAccountLengthConfig[franquicia]['Tarjeta Credito']) {
                    expectedLengths = vdAccountLengthConfig[franquicia]['Tarjeta Credito'];
                } else {
                    expectedLengths = [16];
                    if (!franquicia) {
                        isValid = false;
                        feedbackMessage = 'Por favor, seleccione la Franquicia de la tarjeta.';
                    }
                }
            } else if (canal === 'Cuenta Ahorros' || canal === 'Cuenta Corriente') {
                if (entidad && vdAccountLengthConfig[entidad] && vdAccountLengthConfig[entidad][canal]) {
                    expectedLengths = vdAccountLengthConfig[entidad][canal];
                } else {
                    isValid = false;
                    feedbackMessage = 'Seleccione la entidad bancaria y el tipo de cuenta.';
                }
            } else {
                isValid = false;
                feedbackMessage = 'Seleccione el Canal de Descuento.';
            }

            if (isValid && expectedLengths.length > 0) {
                if (!expectedLengths.includes(numeroLength)) {
                    isValid = false;
                    feedbackMessage = expectedLengths.length === 1 ? `Debe tener ${expectedLengths[0]} dígitos.` : `Debe tener ${expectedLengths.join(' o ')} dígitos.`;
                } else {
                    feedbackMessage = 'Número de dígitos correcto.';
                }
            }

            if (feedbackMessage && numEl && digitosEl) {
                digitosEl.textContent = feedbackMessage + (numeroLength > 0 ? ` (Dígitos: ${numeroLength})` : '');
                if (isValid) {
                    numEl.classList.add('border-green-500');
                    digitosEl.classList.add('text-green-600');
                } else {
                    numEl.classList.add('border-red-500');
                    digitosEl.classList.add('text-red-600');
                }
            } else if (numeroLength > 0 && digitosEl) {
                digitosEl.textContent = 'Dígitos: ' + numeroLength;
                digitosEl.classList.add('text-gray-500');
            }

            return isValid;
        }

        /** Validador DESCUENTO DÉBITO - tiempo real (prima + cuenta) */
        function vdValidarDescuento() {
            if (vdSuppressValidation) return true;
            const primaEl = document.getElementById('vd-valor-prima');
            const prima = parseFloat(primaEl?.value) || 0;
            const cuentaOk = vdValidateAccountNumber();
            const primaOk = prima > 0;
            if (primaEl?.value && prima <= 0) vdMostrarFeedbackCampo(primaEl, false, 'La prima debe ser mayor a 0.');
            else if (primaEl && prima > 0) vdMostrarFeedbackCampo(primaEl, true, '');
            return cuentaOk && primaOk;
        }

        function vdValidarEdad() {
            const fechaEl = document.getElementById('vd-fecha-nacimiento');
            const fecha = fechaEl?.value;
            const disp = document.getElementById('vd-edad-display');
            if (vdSuppressValidation) {
                if (!fecha) { if (disp) disp.textContent = '--'; return true; }
                var ed = vdCalcularEdad(fecha);
                if (disp) disp.textContent = ed != null ? ed + ' años' : '--';
                return true;
            }
            if (!fecha) {
                vdMostrarFeedbackCampo(fechaEl, false, 'Ingrese la fecha de nacimiento.');
                if (disp) disp.textContent = '--';
                return false;
            }
            const edad = vdCalcularEdad(fecha);
            if (edad === null) {
                vdMostrarFeedbackCampo(fechaEl, false, 'Fecha inválida.');
                if (disp) disp.textContent = 'Fecha inválida';
                return false;
            }
            if (disp) disp.textContent = edad + ' años';
            if (edad < 18) {
                vdMostrarFeedbackCampo(fechaEl, false, 'NO ASEGURABLE: Menor de 18 años. La gestión debe suspenderse.');
                disp?.classList.add('text-red-600');
                return false;
            }
            if (edad > 79) {
                vdMostrarFeedbackCampo(fechaEl, false, 'NO ASEGURABLE: Mayor de 79 años. La gestión será desistida.');
                disp?.classList.add('text-red-600');
                return false;
            }
            if (edad > 60 && vdGetProducto() === 'vida') {
                vdMostrarFeedbackCampo(fechaEl, false, 'NO ASEGURABLE: Para Vida no puede ser mayor de 60 años. Ofrezca Seguro de Desempleo.');
                disp?.classList.add('text-amber-600');
                return false;
            }
            vdMostrarFeedbackCampo(fechaEl, true, '');
            disp?.classList.remove('text-red-600', 'text-amber-600');
            return true;
        }

        function vdShowStep(step) {
            vdCurrentStep = step;
            document.querySelectorAll('#modalLead-vd .vd-step').forEach((el, i) => {
                const n = i + 1;
                el.classList.toggle('border-proyectiva-blue', n === step);
                el.classList.toggle('text-proyectiva-blue', n === step);
                el.classList.toggle('border-transparent', n !== step);
                el.classList.toggle('text-gray-500', n !== step);
                var badge = el.firstElementChild;
                if (badge && badge.tagName === 'SPAN') {
                    badge.className = 'w-8 h-8 rounded-full flex items-center justify-center text-sm ' + (n === step ? 'bg-proyectiva-blue text-white' : 'bg-gray-200 text-gray-600');
                }
            });
            document.querySelectorAll('#modalLead-vd .vd-etapa').forEach(el => el.classList.add('hidden'));
            const isVida = vdGetProducto() === 'vida';
            let etapaId = 'vd-etapa-' + step;
            if (step === 2) etapaId += isVida ? '-vida' : '-desempleo';
            else if (step === 4) etapaId += isVida ? '-vida' : '-desempleo';
            const etapa = document.getElementById(etapaId);
            if (etapa) etapa.classList.remove('hidden');
            document.getElementById('vd-btn-prev').classList.toggle('hidden', step === 1);
            document.getElementById('vd-btn-next').classList.toggle('hidden', step === 5);
            document.getElementById('vd-btn-guardar').classList.toggle('hidden', step !== 5);
            if (step === 4 && !isVida) vdRenderCoberturas();
        }

        function vdPrevStep() {
            if (vdCurrentStep > 1) vdShowStep(vdCurrentStep - 1);

        function vdValidateStep(step) {
            const isVida = vdGetProducto() === 'vida';
            if (step === 1) {
                const email = document.getElementById('vd-email-cliente').value?.trim();
                const autoriza = document.querySelector('input[name="vd-autoriza-datos"]:checked')?.value;
                if (!email) { Swal.fire('Validación', 'Ingrese el correo del cliente.', 'warning'); return false; }
                if (!autoriza) { Swal.fire('Validación', 'Indique si el cliente autoriza o no.', 'warning'); return false; }
                if (autoriza === 'no') { Swal.fire('Gestión suspendida', 'El cliente no autorizó. Puede corregir la selección o cerrar manualmente.', 'info'); return false; }
                const fechaNac = document.getElementById('vd-fecha-nacimiento').value;
                const edadDisp = document.getElementById('vd-edad-display').textContent;
                if (!fechaNac) { Swal.fire('Validación', 'Ingrese la fecha de nacimiento y haga clic en Validar Edad.', 'warning'); document.getElementById('vd-fecha-nacimiento').classList.add('border-red-500'); return false; }
                const edad = vdCalcularEdad(fechaNac);
                if (edad === null) { Swal.fire('Validación', 'Fecha de nacimiento inválida.', 'warning'); return false; }
                if (edad < 18) { Swal.fire('No asegurable', 'El cliente es menor de 18 años. La gestión debe suspenderse.', 'error'); return false; }
                if (edad > 79) { Swal.fire('No asegurable', 'El cliente es mayor de 79 años. Puede corregir la fecha o cerrar manualmente.', 'warning'); return false; }
                if (vdGetProducto() === 'vida' && edad > 60) { Swal.fire('No asegurable', 'Para Seguro de Vida el cliente no puede ser mayor de 60 años. Cambie a Desempleo.', 'warning'); return false; }
                if (edadDisp === '--' || edadDisp === 'Digita fecha' || edadDisp === 'Fecha inválida') { Swal.fire('Validación', 'Haga clic en Validar Edad antes de continuar.', 'warning'); return false; }
                const canon = parseFloat(document.getElementById('vd-canon').value) || 0;
                const costo = parseFloat(document.getElementById('vd-costo-proteccion').value) || 0;
                if (canon <= 0 || costo <= 0) { Swal.fire('Validación', 'Complete canon de arrendamiento y costo de protección (Cotizador).', 'warning'); return false; }
            }
            if (step === 2 && isVida) {
                const p1 = document.querySelector('input[name="vd-p1-licito"]:checked')?.value;
                const p2 = document.querySelector('input[name="vd-p2-penal"]:checked')?.value;
                if (p1 === 'no') { Swal.fire('No asegurable', 'Las actividades no son lícitas. Puede corregir o cerrar manualmente.', 'error'); return false; }
                if (p2 === 'no') { Swal.fire('No asegurable', 'El cliente ha tenido proceso penal. Puede corregir o cerrar manualmente.', 'error'); return false; }
                const asegurable = document.getElementById('vd-asegurable')?.value || '';
                if (asegurable === 'NO ASEGURABLE') { Swal.fire('No asegurable', 'El IMC indica que el cliente no es asegurable. Puede corregir o cerrar manualmente.', 'error'); return false; }
                const peso = parseFloat(document.getElementById('vd-peso').value);
                const est = parseFloat(document.getElementById('vd-estatura').value);
                const freq = document.getElementById('vd-frecuencia-deporte').value;
                if (!peso || !est) { Swal.fire('Validación', 'Ingrese peso y estatura.', 'warning'); return false; }
                if (!freq) { Swal.fire('Validación', 'Seleccione frecuencia de deportes.', 'warning'); return false; }
                const medReq = ['vd-hipertension','vd-colesterol','vd-diabetes','vd-coronaria','vd-insuficiencia-renal','vd-cancer','vd-derrame','vd-psicologicas','vd-sida','vd-vih','vd-diagnostico'];
                for (const n of medReq) { if (!document.querySelector(`input[name="${n}"]:checked`)) { Swal.fire('Validación', 'Responda todas las preguntas médicas.', 'warning'); return false; } }
                if (document.querySelector('input[name="vd-sida"]:checked')?.value === 'si' || document.querySelector('input[name="vd-vih"]:checked')?.value === 'si') { Swal.fire('No asegurable', 'SIDA o VIH positivo. Puede corregir o cerrar manualmente.', 'error'); return false; }
                if (!document.getElementById('vd-autoriza-info-medica').checked) { Swal.fire('Validación', 'Debe autorizar el tratamiento de información médica.', 'warning'); return false; }
            }
            if (step === 2 && !isVida) {
                if (!document.querySelector('input[name="vd-des-autoriza"]:checked')) { Swal.fire('Validación', 'Indique si autoriza datos personales.', 'warning'); return false; }
                const vincula = document.querySelector('input[name="vd-tipo-vinculacion"]:checked')?.value;
                if (!vincula) { Swal.fire('Validación', 'Seleccione tipo de vinculación.', 'warning'); return false; }
                if (vincula === 'No asegurable' || vincula === 'No autoriza el tratamiento de datos') {
                    Swal.fire('Gestión suspendida', 'Cliente no asegurable o no autoriza. Puede corregir o cerrar manualmente.', 'info');
                    return false;
                }
                if (vincula === 'Empleado' && !document.getElementById('vd-tipo-contrato').value) { Swal.fire('Validación', 'Seleccione el tipo de contrato.', 'warning'); return false; }
                if (!document.querySelector('input[name="vd-autoriza-reaseg"]:checked')) { Swal.fire('Validación', 'Indique autorización reaseguradora.', 'warning'); return false; }
                const ocupLicita = document.querySelector('input[name="vd-ocupacion-licita"]:checked')?.value;
                if (!ocupLicita) { Swal.fire('Validación', 'Indique si la ocupación es lícita.', 'warning'); return false; }
                if (ocupLicita === 'no') { Swal.fire('No asegurable', 'La ocupación no es lícita. Puede corregir o cerrar manualmente.', 'error'); return false; }
            }
            if (step === 3) {
                const canal = document.getElementById('vd-canal-descuento').value;
                const entidad = document.getElementById('vd-entidad-bancaria').value;
                const num = document.getElementById('vd-numero-cuenta').value?.trim();
                const prima = document.getElementById('vd-valor-prima').value;
                if (!canal || !entidad || !num || !prima) { Swal.fire('Validación', 'Complete todos los campos de descuento.', 'warning'); return false; }
                if (canal === 'Tarjeta Credito') {
                    if (!document.getElementById('vd-franquicia-descuento')?.value) { Swal.fire('Validación', 'Seleccione la Franquicia de la tarjeta.', 'warning'); return false; }
                    if (!document.getElementById('vd-fecha-venc-tc').value) { Swal.fire('Validación', 'Ingrese fecha de vencimiento de la tarjeta.', 'warning'); return false; }
                }
                if (!vdValidateAccountNumber()) { Swal.fire('Validación', 'El número de cuenta/tarjeta no cumple con la longitud requerida para la entidad seleccionada.', 'warning'); return false; }
                if (!document.getElementById('vd-autoriza-debito').checked) { Swal.fire('Validación', 'Debe autorizar el descuento débito.', 'warning'); return false; }
                if (!document.getElementById('vd-entiende-mora').checked) { Swal.fire('Validación', 'Debe confirmar que entiende la mora.', 'warning'); return false; }
            }
            if (step === 4 && isVida) {
                const d1 = parseInt(document.getElementById('vd-ben1-designacion').value) || 0;
                const d2 = parseInt(document.getElementById('vd-ben2-designacion').value) || 0;
                const d3 = parseInt(document.getElementById('vd-ben3-designacion').value) || 0;
                const sum = d1 + d2 + d3;
                if (sum !== 100) { Swal.fire('Validación', 'La suma de designaciones de beneficiarios debe ser 100%.', 'warning'); return false; }
                const n1 = document.getElementById('vd-ben1-nombre').value?.trim();
                if (!n1) { Swal.fire('Validación', 'Ingrese al menos el beneficiario 1.', 'warning'); return false; }
            }
            if (step === 4 && !isVida) {
                if (!document.querySelector('input[name="vd-confirma-coberturas"]:checked')) { Swal.fire('Validación', 'Confirme las coberturas.', 'warning'); return false; }
                const conf = document.querySelector('input[name="vd-confirma-coberturas"]:checked').value;
                if (conf === 'no') { Swal.fire('Gestión suspendida', 'El cliente no confirmó.', 'info'); return false; }
            }
            if (step === 5) {
                if (!document.getElementById('vd-confirma-venta').checked) { Swal.fire('Validación', 'Debe confirmar que la venta se realizó correctamente.', 'warning'); return false; }
            }
            return true;
        }

        function buildActivityLog() {
            var logs = [];
            (appData || []).forEach(function(p) {
                if (!p) return;
                var ref = p.id || 'N/A';
                var hist = p.historial || [];
                if (Array.isArray(hist) && hist.length) {
                    hist.forEach(function(h) {
                        var fecha = h.fecha || h.fechaCreacion || h.timestamp || '';
                        if (!fecha) return;
                        logs.push({
                            fecha: fecha,
                            tipo: 'PQR',
                            desc: (h.accion || h.observacion || h.descripcion || 'Cambio de estado') + (h.estadoAnterior && h.estadoNuevo ? ' (' + h.estadoAnterior + ' → ' + h.estadoNuevo + ')' : ''),
                            ref: ref,
                            usuario: h.usuario || ''
                        });
                    });
                } else if (p.fechaCreacion) {
                    logs.push({ fecha: p.fechaCreacion, tipo: 'PQR', desc: 'Nuevo registro creado', ref: ref, usuario: '' });
                }
            });
            (renovacionesData || []).forEach(function(r) {
                var hg = r.historialGestiones || r.historial || [];
                var ref = (r.leadData && r.leadData.poliza) || r.poliza || 'N/A';
                if (Array.isArray(hg) && hg.length) {
                    hg.forEach(function(h) {
                        var fecha = h.fecha || h.fechaCreacion || h.timestamp || '';
                        if (!fecha) return;
                        logs.push({
                            fecha: fecha,
                            tipo: 'Renovación',
                            desc: h.observacion || (h.estadoGestion ? 'Estado: ' + h.estadoGestion : 'Actualización'),
                            ref: ref,
                            usuario: h.usuario || ''
                        });
                    });
                } else if (r.fechaIngreso || r.fechaCreacion) {
                    logs.push({ fecha: r.fechaIngreso || r.fechaCreacion, tipo: 'Renovación', desc: 'Póliza ingresada', ref: ref, usuario: '' });
                }
            });
            (vdData || []).forEach(function(v) {
                var hg = v.historiaGestiones || v.historialGestiones || v.historial || [];
                var ref = v.numeroSolicitud || v.poliza || v.id || 'N/A';
                if (Array.isArray(hg) && hg.length) {
                    hg.forEach(function(h) {
                        var fecha = h.fecha || h.fechaCreacion || h.timestamp || '';
                        if (!fecha) return;
                        logs.push({
                            fecha: fecha,
                            tipo: 'Vida y Desempleo',
                            desc: h.observacion || (h.estadoGestion ? 'Estado: ' + h.estadoGestion : 'Actualización'),
                            ref: ref,
                            usuario: h.usuario || ''
                        });
                    });
                } else if (v.fechaCreacion || v.fechaIngreso) {
                    logs.push({ fecha: v.fechaCreacion || v.fechaIngreso, tipo: 'Vida y Desempleo', desc: 'Lead ingresado', ref: ref, usuario: '' });
                }
            });
            logs.sort(function(a, b) { return new Date(b.fecha) - new Date(a.fecha); });
            return logs.slice(0, 15);
        }

        // Utilidad para Badges
        function getStatusBadge(estado) {
            const e = (estado || '').toString();
            var variant = 'por-vencer';
            if (e === 'Resuelto') variant = 'vigente';
            else if (e === 'Cerrado') variant = 'vencido';
            return `<span class="status-badge ${variant} text-xs">${e}</span>`;
        }
        
        function getTypeBadge(tipo) {
            const color = tipo === 'QUEJA' ? 'red' : tipo === 'RECLAMO' ? 'orange' : 'blue';
            return `<span class="px-2 py-1 text-xs font-bold rounded bg-${color}-100 text-${color}-700">${tipo}</span>`;
        }

        function formatDate(isoString) {
            if(!isoString) return 'N/A';
            const d = new Date(isoString);
            return d.toLocaleDateString('es-CO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });
        }

        const PAGE_SIZE = 20;
        let pqrPage = 1, renoPage = 1, vdPage = 1, recentPage = 1;
        let adminSinAsignarPage = 1, adminAsignadasPage = 1, adminNovedadesPage = 1;

        function renderPagination(containerId, currentPage, totalItems, onPageChange) {
            const el = document.getElementById(containerId);
            if (!el) return;
            if (totalItems === 0) {
                el.innerHTML = '<span class="text-gray-600">No hay registros</span>';
                return;
            }
            const totalPages = Math.max(1, Math.ceil(totalItems / PAGE_SIZE));
            const start = (currentPage - 1) * PAGE_SIZE + 1;
            const end = Math.min(currentPage * PAGE_SIZE, totalItems);
            el.innerHTML = totalItems <= PAGE_SIZE ? `
                <span class="text-gray-600">Mostrando ${totalItems} de ${totalItems} registros</span>
            ` : `
                <span class="text-gray-600">Mostrando ${start}-${end} de ${totalItems} registros</span>
                <div class="flex gap-2 items-center">
                    <button onclick="${onPageChange}(${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''} class="px-3 py-1 rounded border border-gray-300 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100">Anterior</button>
                    <span class="text-sm text-gray-700">Pág. ${currentPage} de ${totalPages}</span>
                    <button onclick="${onPageChange}(${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''} class="px-3 py-1 rounded border border-gray-300 text-sm font-medium disabled:opacity-50 disabled:cursor-not-allowed hover:bg-gray-100">Siguiente</button>
                </div>
            `;
        }

        function drawChart(data) {
            const canvas = document.getElementById('typeChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            var raw = Array.isArray(data) ? data : appData;
            var source = raw.filter(function(p) { return p && p.informacion && p.informacion.tramite; });
            
            const conteo = { 'QUEJA': 0, 'PETICION': 0, 'RECLAMO': 0 };
            source.forEach(p => {
                const t = (p.informacion.tramite.tipoSolicitud) ? p.informacion.tramite.tipoSolicitud : 'OTRO';
                conteo[t] = (conteo[t] || 0) + 1;
            });

            if(chartInstance) chartInstance.destroy();

            var chartType = (getDashboardSettings().chartType || 'doughnut');
            chartInstance = new Chart(ctx, {
                type: chartType,
                data: {
                    labels: Object.keys(conteo),
                    datasets: [{
                        data: Object.values(conteo),
                        backgroundColor: ['#EF4444', '#3B82F6', '#FF6B00', '#10B981'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    cutout: chartType === 'doughnut' ? '70%' : 0,
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } }
                    }
                }
            });
        }

                    <div class="absolute left-0 top-1 w-6 h-6 rounded-full ${dotColor} border-4 border-white shadow-sm"></div>
                    <div class="bg-gray-50 p-3 rounded-lg border border-gray-100 shadow-sm">
                        <div class="flex justify-between items-start mb-1">
                            <span class="text-xs font-bold text-gray-700">${item.usuario}</span>
                            <span class="text-[10px] text-gray-500 flex items-center gap-1"><i class="far fa-clock"></i> ${formatDate(item.fecha)}</span>
                        </div>
                        <p class="text-sm text-gray-600 leading-snug">${item.accion}</p>
                        ${item.estadoAnterior !== item.estadoNuevo ? 
                          `<div class="mt-2 text-[10px] bg-white inline-block px-2 py-1 rounded border border-gray-200 text-gray-500">
                             Estado: <span class="line-through">${item.estadoAnterior}</span> &rarr; <span class="font-bold text-proyectiva-orange">${item.estadoNuevo}</span>
                           </div>` : ''}
                    </div>
                `;
                container.appendChild(itemDiv);
            });
        }

        // --- GUARDAR GESTIÓN ---
        function savePQR(e) {
            e.preventDefault();
            
            const btnSubmit = e.target.querySelector('button[type="submit"]');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

            const nuevoEstado = document.getElementById('inp-estado').value;
            const nuevoAsesor = document.getElementById('inp-asesor').value;
            const nota = document.getElementById('inp-nota').value;

            const payload = {
                ...currentPQR,
                estadoAnterior: currentPQR.estado,
                estado: nuevoEstado,
                asesor: nuevoAsesor,
                nuevaAccionTexto: nota
            };

            if (isAppsScript) {
                google.script.run
                    .withSuccessHandler(response => {
                        const res = JSON.parse(response);
                        if(res.status === 'success') {
                            Swal.fire({
                                icon: 'success', title: 'Gestión guardada', text: 'La PQR ha sido actualizada.',
                                confirmButtonColor: '#FF6B00'
                            });
                            closeModal();
                            loadData(); // Recargar todo
                        } else {
                            showError("Error al guardar", res.message);
                        }
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = '<i class="fas fa-save"></i> Guardar Gestión';
                    })
                    .withFailureHandler(error => {
                        showError("Error de red", error);
                        btnSubmit.disabled = false;
                        btnSubmit.innerHTML = '<i class="fas fa-save"></i> Guardar Gestión';
                    })
                    .updatePQR(JSON.stringify(payload));
            } else {
                // Mock Guardado
                setTimeout(() => {
                    Swal.fire({ icon: 'success', title: 'Gestión guardada (Modo Preview)', text: 'En el entorno real esto se guardaría en Google Sheets.', confirmButtonColor: '#FF6B00' });
                    closeModal();
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<i class="fas fa-save"></i> Guardar Gestión';
                }, 1000);
            }
        }

        function showError(title, text) {
            Swal.fire({ icon: 'error', title: title, text: text, confirmButtonColor: '#002A54' });
        }
    </script>
