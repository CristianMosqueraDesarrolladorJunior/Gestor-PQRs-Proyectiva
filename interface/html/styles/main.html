<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
        --primary-color: #253150;
        --primary-color-rgb: 37, 49, 80;
        --secondary-color: #FF6B00;
        --success-color: #28A745;
        --warning-color: #FFC107;
        --danger-color: #DC3545;
        --light-color: #F8F9FA;
        --dark-color: #333333;
        --gray-color: #6c757d;
        --primary-gradient: linear-gradient(135deg, #253150 0%, #152440 100%);
        --success-gradient: linear-gradient(135deg, #0fdb7c 0%, #38ef7d 100%);
        --danger-gradient: linear-gradient(135deg, #bd0f14 0%, #e11f27 100%);
        --warning-gradient: linear-gradient(135deg, #ffa300 0%, #ffb347 100%);
        --border-radius: 12px;
        --shadow-soft: 0 4px 12px rgba(0, 0, 0, 0.08);
        --shadow-hover: 0 8px 24px rgba(0, 0, 0, 0.12);
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #F8FAFC;
    }

    .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 9999px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
    }

    #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100%;
    }

    .sidebar-collapsed {
        transform: translateX(-100%);
        pointer-events: none;
    }

    /* Animaciones para el Modal */
    .modal-enter {
        animation: fadeIn 0.3s ease-out forwards;
    }

    .modal-content-enter {
        animation: slideUp 0.3s ease-out forwards;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(20px) scale(0.95);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
    }

    @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .fade-in-up { animation: fadeInUp 0.6s ease-out; }
    .pulse-animation { animation: pulse 2s infinite; }
    .bounce-animation { animation: bounce 0.6s ease; }

    .vd-etapa {
        animation: fadeIn 0.25s ease-out;
    }

    .vd-step {
        transition: all 0.2s ease;
    }

    .vd-step:hover {
        background: rgba(0, 42, 84, 0.05);
    }

    .vd-guion-card {
        border-left: 4px solid #002A54;
    }

    .vd-input-focus:focus {
        box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.3);
    }

    /* Modal VD: texto legible, sin cortes */
    .vd-modal-content p,
    .vd-modal-content label,
    .vd-modal-content span {
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    .vd-modal-content .min-w-0 {
        min-width: 0;
    }

    .vd-cell-truncate {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .vd-cell-truncate:hover {
        white-space: normal;
        overflow: visible;
    }

    /* Tablas: texto visible, wrap en celdas largas */
    #pqr-table td,
    #reno-table td,
    #vd-table td {
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    /* Modal PQR: texto legible sin cortes */
    #gestionModal .modal-content-enter p,
    #gestionModal .modal-content-enter label,
    #gestionModal .modal-content-enter span,
    #gestionModal .modal-content-enter td {
        word-wrap: break-word;
        overflow-wrap: break-word;
    }

    .modal-header-gradient {
        background: var(--primary-gradient);
        color: #fff;
        border: none;
    }

    #modalLeadGestion #modalLeadGestionCard {
        display: flex;
        flex-direction: column;
        max-height: 95vh;
    }

    #modalLeadGestion #modalLeadGestionScroll {
        flex: 1 1 0%;
        min-height: 0;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
    }

    .kpi-card {
        background: #fff;
        border-radius: var(--border-radius);
        box-shadow: var(--shadow-soft);
        border-left: 4px solid var(--primary-color);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .kpi-card:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-hover);
    }
    .kpi-card.kpi-blue { border-left-color: #3B82F6; }
    .kpi-card.kpi-yellow { border-left-color: var(--warning-color); }
    .kpi-card.kpi-green { border-left-color: var(--success-color); }
    .kpi-card.kpi-red { border-left-color: var(--danger-color); }
    .kpi-card.kpi-orange { border-left-color: var(--secondary-color); }
    .kpi-card.kpi-gray { border-left-color: var(--gray-color); }
    .kpi-card .kpi-icon {
        width: 60px; height: 60px;
        border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.5rem;
    }
    .kpi-card .kpi-icon.icon-blue { background: rgba(59,130,246,0.1); color: #3B82F6; }
    .kpi-card .kpi-icon.icon-yellow { background: rgba(255,193,7,0.1); color: var(--warning-color); }
    .kpi-card .kpi-icon.icon-green { background: rgba(40,167,69,0.1); color: var(--success-color); }
    .kpi-card .kpi-icon.icon-red { background: rgba(220,53,69,0.1); color: var(--danger-color); }
    .kpi-card .kpi-icon.icon-orange { background: rgba(255,107,0,0.1); color: var(--secondary-color); }
    .kpi-card .kpi-icon.icon-gray { background: rgba(108,117,125,0.1); color: var(--gray-color); }

    .progressbar {
        counter-reset: step;
        padding: 0; margin: 0;
        display: flex; justify-content: space-between;
        list-style: none;
    }
    .progressbar li {
        flex: 1; text-align: center;
        position: relative; font-size: 0.75rem;
        color: var(--gray-color); font-weight: 600;
        padding-bottom: 8px;
        border-bottom: 2px solid transparent;
        transition: all 0.3s ease;
        z-index: 1;
    }
    .progressbar li::before {
        content: counter(step); counter-increment: step;
        width: 36px; height: 36px; line-height: 36px;
        border: 2px solid #ddd;
        display: block; text-align: center;
        margin: 0 auto 8px auto;
        border-radius: 50%; background: white;
        color: #333; font-weight: 700; font-size: 0.875rem;
        position: relative; z-index: 3;
        transition: all 0.3s ease;
    }
    .progressbar li::after {
        content: ''; position: absolute;
        width: 74%; height: 2px;
        background: #ddd; top: 17px; left: -35%; z-index: 2;
        transition: background-color 0.3s ease;
    }
    .progressbar li:first-child::after { content: none; }
    .progressbar li.completed,
    .progressbar li.highest-reached {
        color: var(--primary-color);
    }
    .progressbar li.completed::before,
    .progressbar li.highest-reached::before {
        border-color: var(--primary-color);
        background: var(--primary-color); color: white;
    }
    .progressbar li.completed::after,
    .progressbar li.highest-reached::after {
        background: var(--primary-color);
    }
    .progressbar li.current-etapa {
        color: var(--primary-color); font-weight: 700;
        border-bottom: 4px solid var(--primary-color);
    }
    .progressbar li.current-etapa::before {
        border-color: var(--primary-color);
        background: var(--primary-color); color: white;
        transform: scale(1.1);
        box-shadow: 0 0 0 3px rgba(var(--primary-color-rgb), 0.3);
    }
    .progressbar li.clickable-step { cursor: pointer; }
    .progressbar li.clickable-step:hover { opacity: 0.8; }

    .form-group-enhanced {
        background: white; border: 1px solid #e9ecef;
        border-radius: 8px; padding: 0.75rem 1rem;
        margin-bottom: 1rem; transition: all 0.3s ease;
    }
    .form-group-enhanced:focus-within {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 2px rgba(var(--primary-color-rgb), 0.15);
    }
    .file-upload-area {
        border: 2px dashed #cbd5e1;
        border-radius: 8px;
        padding: 1.25rem;
        text-align: center;
        transition: border-color 0.2s, background 0.2s;
    }
    .file-upload-area:hover,
    .file-upload-area.drag-over {
        border-color: var(--primary-color);
        background: rgba(37, 49, 80, 0.04);
    }
    .otp-input-enhanced {
        width: 50px; height: 50px;
        font-size: 1.5rem; font-weight: 700;
        text-align: center;
        border-radius: 8px;
        transition: transform 0.15s ease;
    }
    .otp-input-enhanced:focus {
        transform: scale(1.05);
        outline: none;
        box-shadow: 0 0 0 2px rgba(255, 107, 0, 0.35);
    }

    .status-badge {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        border-radius: 50px;
        padding: 0.5rem 1rem;
        font-weight: 600;
        font-size: 0.75rem;
        color: #fff;
    }
    .status-badge.vigente { background: var(--success-gradient); }
    .status-badge.vencido { background: var(--danger-gradient); }
    .status-badge.por-vencer { background: var(--warning-gradient); color: #333; }

    table.crm-leads-table thead tr {
        background: var(--primary-gradient);
        color: #fff;
    }
    table.crm-leads-table thead th {
        color: rgba(255,255,255,0.95);
        font-weight: 600;
    }
    table.crm-leads-table tbody tr:nth-child(odd) {
        background: rgba(248, 250, 252, 0.9);
    }
    table.crm-leads-table tbody tr:hover {
        background: rgba(21, 36, 64, 0.05);
    }
    table.crm-leads-table .crm-action-btn {
        border-radius: 50px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    table.crm-leads-table .crm-action-btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-soft);
    }

    .timeline-item {
        display: flex;
        gap: 1rem;
        margin-bottom: 1rem;
        align-items: flex-start;
    }
    .timeline-item .timeline-icon {
        width: 40px; height: 40px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--primary-gradient);
        color: #fff;
        font-size: 0.875rem;
    }
    .timeline-content {
        flex: 1;
        background: #fff;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        border: 1px solid #e5e7eb;
    }

    .data-item {
        background: linear-gradient(145deg, #ffffff, #f8f9fa);
        border: 1px solid #e9ecef;
        border-radius: 8px;
        padding: 0.75rem 1rem;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .data-item:hover {
        border-color: var(--primary-color);
        box-shadow: var(--shadow-soft);
    }
    .data-item .data-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--gray-color);
    }
    .data-item .data-value {
        font-weight: 600;
        color: var(--dark-color);
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.01ms !important;
        }
    }

    /* Modal ajustes dashboard */
    #modalDashboardSettings {
        backdrop-filter: blur(4px);
    }

    /* KPIs compactos: 4 por fila */
    #dashboard-kpis > div {
        min-width: 0;
    }

    @media (max-width: 640px) {
        #dashboard-kpis .text-xl {
            font-size: 1.125rem;
        }
    }
</style>
